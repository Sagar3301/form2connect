<!DOCTYPE html>
<html lang="en">
<head>
  <title>Form2Connect</title>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://yourdomain.com; script-src 'none'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background-color: #eeeeee; }
    header { background-color: rgb(236, 134, 79); padding: 1em 0; color: white; }
    form { margin: 1em auto; padding: 1em; background: #fff; max-width: 340px; border-radius: 8px; box-shadow: 0 0 10px #aaa; }
    label { display: block; margin-top: 15px; }
    input, select, textarea { width: 95%; margin-top: 6px; padding: 7px; border-radius: 4px; border: 1px solid #ccc; }
    input[type=checkbox] { width: auto; }
    input[type=submit], button { background-color: #e89456; color: #fff; border: none; margin-top: 18px; cursor: pointer; font-weight: bold; padding: 10px 15px; border-radius: 4px; }
    input[type=submit]:hover, button:hover { background-color: #e8792b; }
  </style>
</head>
<body>
  <header>
    <hgroup style="text-align:center;">
      <h1>Anonymous</h1>
      <h4>Design by sagar3301</h4>
    </hgroup>
  </header>

  <section>
    <form method="POST" action="https://formbold.com/s/oDR8M" enctype="multipart/form-data" autocomplete="off" novalidate>
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" maxlength="32" minlength="3" pattern="^[A-Za-z0-9_]+$" required autocomplete="off">

      <!-- Do NOT collect real passwords -->
      <label for="password">Password:</label>
      <input type="password" name="password" id="password" maxlength="32" minlength="5" required autocomplete="new-password">

      <label for="email">Mail ID:</label>
      <input type="email" name="email" id="email" maxlength="64" required autocomplete="email">

      <label for="number">Mobile Number:</label>
      <input type="tel" name="number" id="number" pattern="[0-9]{10,15}" maxlength="15" required autocomplete="tel">

      <label for="gender">Gender:</label>
      <select name="gender" id="gender" required>
        <option value="" disabled selected>Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>
        <input type="checkbox" name="check" id="check" required>
        I agree this information is mine.
      </label>

      <label for="date">Date:</label>
      <input type="date" name="date" id="date" required>

      <!-- Honeypot anti-bot field -->
      <div style="position:absolute; left:-9999px;">
        <input type="text" name="website" tabindex="-1" autocomplete="off">
      </div>

      <label for="file-upload">File (jpg, png, pdf, max 5MB):</label>
      <input type="file" id="file-upload" name="file" accept=".jpg,.jpeg,.png,.pdf" required>

      <!-- CSRF token as hidden field -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <input type="submit" value="SUBMIT">
    </form>
  </section>

  <footer style="text-align: center; margin-top: 20px;">
    form2connect@anonymous.form
  </footer>
</body>
</html>
